# infra/cloudbuild.yaml
# Triggered on push to main branch
steps:
  # ── Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/eventrevo:$COMMIT_SHA'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/eventrevo:latest'
      - '--build-arg'
      - 'REACT_APP_STRIPE_PUBLISHABLE_KEY=$$STRIPE_PK'
      - '.'
    secretEnv: ['STRIPE_PK']

  # ── Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/eventrevo']

  # ── Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eventrevo'
      - '--image=gcr.io/$PROJECT_ID/eventrevo:$COMMIT_SHA'
      - '--region=australia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=8080'
      - '--set-secrets=MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=JWT_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,EMAIL_PASS=EMAIL_PASS:latest'
      - '--set-env-vars=NODE_ENV=production,CLIENT_URL=https://eventrevo.com.au'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/STRIPE_PK/versions/latest
      env: 'STRIPE_PK'

images:
  - 'gcr.io/$PROJECT_ID/eventrevo:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/eventrevo:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
